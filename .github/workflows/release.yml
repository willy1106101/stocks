name: Build and Release willyStocks

on:
  push:
    tags:
      - 'v*' # 觸發條件：推送 v 開頭的標籤（例如 v1.0.0）

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # 如果你有 requirements.txt，請取消下方註解來安裝主程式需要的套件（例如 yfinance）：
          # pip install -r requirements.txt

      - name: 打包主程式與更新程式
        run: |
          # 假設你的主程式進入點是 main.py，請依實際情況修改檔案名稱
          pyinstaller --noconsole --onefile --name="willyStocks" --icon="favicon.ico" --hidden-import=yfinance --hidden-import=twstock --hidden-import=pandas --hidden-import=webview --collect-all twstock --collect-all webview --add-data "dashboard.html;." desktop_app.py
          pyinstaller --noconsole --onefile --name="update" --icon="favicon.ico" update.py

      - name: 產生主程式 SHA-256 驗證檔
        shell: pwsh
        run: |
          # 計算 willyStocks.exe 的 SHA-256 供下載驗證使用
          $hash = (Get-FileHash -Path dist\willyStocks.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist\willyStocks.exe.sha256 -Value $hash

      - name: 發布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/willyStocks.exe
            dist/willyStocks.exe.sha256
            dist/update.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}